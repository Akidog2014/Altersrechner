<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Altersrechner</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

.container{
    max-width:420px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#003366;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    font-size:24px;
    text-align:center;
    border-radius:8px;
    border:1px solid #999;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:8px;
    background:#0066cc;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#004999;
}

#ergebnis{
    margin-top:30px;
    font-size:22px;
    text-align:center;
    line-height:1.7;
}

.massnahme{
    margin-top:10px;
    font-size:28px;
    font-weight:bold;
    color:#cc0000;
}

</style>

</head>

<body>

<div class="container">

<h1>Altersrechner</h1>

<label>Geburtsdatum</label>

<input
type="text"
id="geburt"
placeholder="TTMMJJJJ"
maxlength="10"
oninput="datumFormatieren()">

<button onclick="alterBerechnen()">
Alter berechnen
</button>

<div id="ergebnis"></div>

</div>

<script>

function datumFormatieren(){

    let feld = document.getElementById("geburt");

    let wert = feld.value.replace(/\D/g,"");

    if(wert.length > 8){
        wert = wert.substring(0,8);
    }

    if(wert.length > 4){
        wert = wert.replace(/(\d{2})(\d{2})(\d+)/,"$1.$2.$3");
    }
    else if(wert.length > 2){
        wert = wert.replace(/(\d{2})(\d+)/,"$1.$2");
    }

    feld.value = wert;
}


function alterBerechnen(){

    let eingabe = document.getElementById("geburt").value;

    if(eingabe.length != 10){
        document.getElementById("ergebnis").innerHTML =
        "Bitte ein gültiges Geburtsdatum eingeben.";
        return;
    }

    let teile = eingabe.split(".");

    let tag = parseInt(teile[0]);
    let monat = parseInt(teile[1]);
    let jahr = parseInt(teile[2]);

    let geburt = new Date(jahr, monat - 1, tag);

    // Prüfen, ob das Datum tatsächlich gültig ist
    if(
        geburt.getDate() != tag ||
        geburt.getMonth() != monat - 1 ||
        geburt.getFullYear() != jahr
    ){
        document.getElementById("ergebnis").innerHTML =
        "Ungültiges Datum.";
        return;
    }

    let heute = new Date();

    // Alter berechnen
    let jahre = heute.getFullYear() - geburt.getFullYear();
    let monate = heute.getMonth() - geburt.getMonth();
    let tage = heute.getDate() - geburt.getDate();

    if(tage < 0){

        monate--;

        let letzterMonat = new Date(
            heute.getFullYear(),
            heute.getMonth(),
            0
        );

        tage += letzterMonat.getDate();
    }

    if(monate < 0){
        jahre--;
        monate += 12;
    }

    // Maßnahme bestimmen
    // Ab dem 10. Geburtstag: Schülerrapport
    // Ab dem 15. Geburtstag: Ordnungsbusse

    let massnahme = "";

    if(jahre < 10){
        massnahme = "Ermahnt";
    }
    else if(jahre < 15){
        massnahme = "Schülerrapport";
    }
    else{
        massnahme = "Ordnungsbusse";
    }

    // Ergebnis anzeigen
    document.getElementById("ergebnis").innerHTML =
    "<b>Alter</b><br>" +
    jahre + " Jahre<br>" +
    monate + " Monate<br>" +
    tage + " Tage" +
    "<div class='massnahme'>" +
    massnahme +
    "</div>";

}

</script>

</body>
</html>
